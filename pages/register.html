<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="پیش‌نمایش ثبت‌نام PAWIX؛ ثبت‌نام واقعی تا اتصال بک‌اند انجام نمی‌شود." />
    <title>ثبت‌نام | PAWIX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <div class="auth-brand-row">
        <a class="brand" href="../index.html" aria-label="PAWIX - خانه">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="20" cy="16" r="5"></circle><circle cx="30" cy="12" r="5"></circle><circle cx="40" cy="16" r="5"></circle><circle cx="25" cy="26" r="5"></circle><circle cx="35" cy="26" r="5"></circle><path d="M32 35c-10 0-18 8-18 18v3h36v-3c0-10-8-18-18-18Z"></path></svg></span>
          <span class="brand-name">PAWIX</span>
        </a>
      </div>
      <section class="auth-card" aria-labelledby="register-title">
        <span class="auth-eyebrow">JOIN PAWIX</span>
        <h1 id="register-title">ساخت حساب کاربری</h1>
        <p class="auth-intro">فرم برای پیش‌نمایش و اعتبارسنجی محلی است.</p>
        <form class="auth-form" data-auth-form data-auth-mode="register" novalidate>
          <div class="auth-field">
            <label for="register-first-name">نام</label>
            <input id="register-first-name" name="firstName" type="text" autocomplete="given-name" required aria-describedby="register-first-name-error" />
            <span class="auth-field-error" id="register-first-name-error"></span>
          </div>
          <div class="auth-field">
            <label for="register-last-name">نام خانوادگی</label>
            <input id="register-last-name" name="lastName" type="text" autocomplete="family-name" required aria-describedby="register-last-name-error" />
            <span class="auth-field-error" id="register-last-name-error"></span>
          </div>
          <div class="auth-field">
            <label for="register-mobile">شماره موبایل</label>
            <input id="register-mobile" name="phone" type="tel" inputmode="tel" autocomplete="tel" required aria-describedby="register-mobile-error" />
            <span class="auth-field-error" id="register-mobile-error"></span>
          </div>
          <div class="auth-field">
            <label for="register-email">ایمیل</label>
            <input id="register-email" name="email" type="email" inputmode="email" autocomplete="email" dir="ltr" required aria-describedby="register-email-error" />
            <span class="auth-field-error" id="register-email-error"></span>
          </div>
          <div class="auth-field">
            <label for="register-password">رمز عبور</label>
            <div class="password-field">
              <input id="register-password" name="password" type="password" autocomplete="new-password" required aria-describedby="register-password-error" />
              <button class="password-toggle" type="button" data-password-toggle="register-password" aria-label="نمایش رمز عبور">نمایش</button>
            </div>
            <span class="auth-field-error" id="register-password-error"></span>
          </div>
          <div class="auth-field">
            <label for="register-confirm-password">تکرار رمز عبور</label>
            <div class="password-field">
              <input id="register-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required aria-describedby="register-confirm-password-error" />
              <button class="password-toggle" type="button" data-password-toggle="register-confirm-password" aria-label="نمایش تکرار رمز عبور">نمایش</button>
            </div>
            <span class="auth-field-error" id="register-confirm-password-error"></span>
          </div>
          <label class="auth-check">
            <input type="checkbox" name="terms" required />
            <span>شرایط و قوانین استفاده را می‌پذیرم.</span>
          </label>
          <span class="auth-field-error" id="register-terms-error"></span>
          <button class="auth-submit" type="submit">ثبت‌نام</button>
          <p class="auth-status" role="status" aria-live="polite">
            ثبت‌نام واقعی در دسترس نیست؛ اطلاعات فرم ارسال یا ذخیره نمی‌شود.
          </p>
        </form>
        <div class="auth-links">
          <span>قبلاً حساب ساختی؟ <a href="login.html">وارد شو</a></span>
          <a href="../index.html">بازگشت به صفحه اصلی</a>
        </div>
      </section>
    </main>
    <script src="../js/auth.js"></script>
  </body>
</html>
